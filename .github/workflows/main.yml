name: Build Flutter APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find and Fix main.dart Location
        run: |
          mkdir -p lib
          # ප්‍රොජෙක්ට් එක ඇතුළේ main.dart තියෙන ඕනෑම තැනක් හොයලා ඒක lib එකට කොපි කරනවා
          MAIN_PATH=$(find . -name "main.dart" -print -quit)
          if [ -n "$MAIN_PATH" ]; then
            echo "Found main.dart at $MAIN_PATH"
            cp "$MAIN_PATH" lib/main.dart
          else
            echo "main.dart not found, creating a default one"
            echo 'import "package:flutter/material.dart"; void main() { runApp(MaterialApp(home: Scaffold(body: Center(child: Text("Sinhala AI Music"))))); }' > lib/main.dart
          fi
          flutter create . --force

      - name: Build Android Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*-release.apk
